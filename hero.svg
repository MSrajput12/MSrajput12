<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Manish Rajput GitHub profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#172236" stroke-width="1"/>
    </pattern>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2879bd"/>
      <stop offset="100%" stop-color="#7668bd"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="100%" stop-color="#9eb8df"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="660" rx="26" fill="#080d18"/>
  <rect width="1200" height="660" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="658" rx="25"
        fill="none" stroke="#24344c"/>

  <!-- Header -->
  <g font-family="monospace" fill="#93a8c9">
    <text x="48" y="55" font-size="15" letter-spacing="4">
      MANISH / LIVING IDENTITY
    </text>
    <text x="1150" y="55" font-size="15" text-anchor="end">
      @msrajput12
    </text>
  </g>

  <!-- Introduction -->
  <text x="50" y="145" fill="#3999df" font-family="monospace"
        font-size="16" letter-spacing="5">HELLO, WORLD. I'M</text>

  <g font-family="monospace" font-weight="bold"
     font-size="83" fill="url(#name)">
    <text x="48" y="245">Manish</text>
    <text x="48" y="335">Rajput</text>
  </g>

  <text x="50" y="405" fill="#e5edfc"
        font-family="monospace" font-size="23">
    Python / Swift / Java
  </text>

  <text x="50" y="443" fill="#91a5c5"
        font-family="monospace" font-size="16">
    Building useful things on the public internet
  </text>

  <!-- Identity circle -->
  <circle cx="930" cy="285" r="210"
          fill="#0c1424" stroke="#1d304b"/>

  <circle cx="930" cy="285" r="194"
          fill="none" stroke="url(#ring)"
          stroke-width="1.5" stroke-dasharray="250 35 90 40"/>

  <circle cx="930" cy="285" r="165"
          fill="none" stroke="#213650"
          stroke-width="1" stroke-dasharray="2 10"/>

  <!-- Abstract developer glyph -->
  <g fill="#7192bd" font-family="monospace"
     font-size="13" text-anchor="middle">
    <text x="930" y="200">010010</text>
    <text x="900" y="220">10110110</text>
    <text x="955" y="220">11001</text>
    <text x="875" y="242">0110101</text>
    <text x="947" y="242">101100</text>
    <text x="930" y="264">01110101</text>
    <text x="895" y="286">101010</text>
    <text x="960" y="286">011011</text>
    <text x="930" y="308">11001010</text>
    <text x="902" y="330">010110</text>
    <text x="950" y="330">101101</text>
    <text x="930" y="352">01101001</text>
    <text x="912" y="374">101010</text>
  </g>

  <circle cx="930" cy="285" r="4" fill="#69b8ff"/>
  <circle cx="930" cy="285" r="11"
          fill="none" stroke="#69b8ff" opacity=".5"/>

  <!-- Divider -->
  <line x1="48" y1="520" x2="1152" y2="520"
        stroke="#29364b" stroke-width="1"/>

  <!-- Stats -->
  <g font-family="monospace">
    <g fill="#94a8c7" font-size="13" letter-spacing="2">
      <text x="50" y="560">REPOSITORIES</text>
      <text x="330" y="560">STARS</text>
      <text x="610" y="560">CONTRIBUTIONS</text>
      <text x="910" y="560">FOLLOWERS</text>
    </g>

    <g fill="#e8efff" font-size="35">
      <text x="50" y="605">4</text>
      <text x="330" y="605">0</text>
      <text x="610" y="605">24</text>
      <text x="910" y="605">3</text>
    </g>

    <g fill="#3999df">
      <circle cx="285" cy="555" r="3.5"/>
      <circle cx="565" cy="555" r="3.5"/>
      <circle cx="865" cy="555" r="3.5"/>
      <circle cx="1150" cy="555" r="3.5"/>
    </g>
  </g>
</svg>
